<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PitGraph</title>
  <link rel="icon" href="data:,">
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e2de;
      --accent: #c8102e; --accent-soft: #fbe9ec; --ok: #1f7a4d; --ok-soft: #e5f4ec;
      --warn: #9a5b00; --warn-soft: #fdf1dc; --info: #1f4f8a; --info-soft: #e7eef8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416; --panel: #1d1d20; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33;
        --accent: #ff4d5e; --accent-soft: #3a1c21; --ok: #5fd39a; --ok-soft: #173126;
        --warn: #f0b252; --warn-soft: #362812; --info: #7fb0f0; --info-soft: #172537;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px;
             border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { margin: 0 12px 0 0; font-size: 18px; }
    header h1 span { color: var(--accent); }
    label.user { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
    input, textarea, button { font: inherit; color: inherit; }
    input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
    button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .session { color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100vh - 58px); }
    @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); height: auto; } #chat { border-right: 0; } }
    #chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 60vh; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 100%; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
    .msg.user { align-self: flex-end; background: var(--accent-soft); border-color: transparent; max-width: 85%; }
    .msg .verdict { font-weight: 600; margin-bottom: 6px; }
    .msg .reasoning { color: var(--ink); }
    .msg .error { color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
    .chip.ok { background: var(--ok-soft); color: var(--ok); }
    .chip.warn { background: var(--warn-soft); color: var(--warn); }
    .chip.info { background: var(--info-soft); color: var(--info); }
    .chain { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .chain b { color: var(--ink); font-weight: 600; }
    .box { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--bg); font-size: 13px; }
    .box h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    details { margin-top: 8px; font-size: 13px; }
    summary { cursor: pointer; color: var(--muted); }
    ul.plain { margin: 4px 0 0; padding-left: 18px; }
    form#ask { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
    form#ask textarea { flex: 1; min-width: 0; resize: vertical; min-height: 42px; }
    #side { display: flex; flex-direction: column; min-height: 60vh; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); }
    .tabs button { border: 0; border-radius: 0; border-bottom: 2px solid transparent; background: none; padding: 10px 16px; }
    .tabs button[aria-selected="true"] { border-bottom-color: var(--accent); font-weight: 600; }
    .tab { flex: 1; overflow-y: auto; padding: 16px; overflow-wrap: anywhere; }
    .tab[hidden] { display: none; }
    #graph { height: 380px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    h3 { font-size: 14px; margin: 16px 0 6px; }
    .empty { color: var(--muted); font-size: 14px; }
    .insight { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: var(--panel); font-size: 14px; }
    .insight.retired { opacity: .6; text-decoration: line-through; }
    .insight .meta { font-size: 12px; color: var(--muted); }
    .answer-row { display: block; width: 100%; text-align: left; margin-bottom: 6px; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  </style>
</head>
<body>
  <header>
    <h1>Pit<span>Graph</span></h1>
    <label class="user">User <input id="user" size="12" autocomplete="off" pattern="[A-Za-z0-9_]{1,64}"></label>
    <button id="new-session" type="button">New session</button>
    <span class="session" id="session-label">New session</span>
  </header>
  <main>
    <section id="chat" aria-label="Chat">
      <div id="messages">
        <p class="empty">Ask about tyre strategy, safety cars, or how circuits compare (2023–2025 races).
          Try: <em>"Best strategy at Monza for a top-5 finish?"</em></p>
      </div>
      <form id="ask">
        <textarea id="question" rows="2" maxlength="500" placeholder="Ask a strategy question…" required></textarea>
        <button class="primary" id="send" type="submit">Ask</button>
      </form>
    </section>
    <section id="side" aria-label="Details">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-why" aria-selected="true" aria-controls="why">Why?</button>
        <button role="tab" id="tab-memory" aria-selected="false" aria-controls="memory">Memory</button>
      </div>
      <div class="tab" id="why" role="tabpanel">
        <p class="empty">Click <b>Why?</b> on an answer to see the evidence subgraph behind it.</p>
      </div>
      <div class="tab" id="memory" role="tabpanel" hidden></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
